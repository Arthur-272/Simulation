<div class="modal-header">
  <h4 class="modal-title">Select file type</h4>

  <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="cancel()">&times;</button>
</div>

<div class="modal-body">
  <jhi-alert-error></jhi-alert-error>

  <select (change)="onSelectFormat($event)">
    <option disabled>Select output format</option>
    <option *ngFor="let format of formats" [ngValue]="format.name">{{ format.name }}</option>
  </select>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cancel()"><fa-icon icon="ban"></fa-icon>&nbsp;<span>Cancel</span></button>

  <button type="button" id="save-entity" class="btn btn-primary" (click)="onDownload()">
    <fa-icon icon="save"></fa-icon>&nbsp;<span>Download</span>
  </button>
</div>
