<div class="modal-header">
  <h4 class="modal-title">Upload model</h4>

  <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="cancel()">&times;</button>
</div>

<div class="modal-body">
  <jhi-alert-error></jhi-alert-error>

  <input type="file" (change)="onFileSelected($event)" />

  <div class="progress mb-3 mt-3" *ngIf="progress > 0">
    <div class="progress-bar progress-bar-striped bg-success" role="progressbar" [style.width.%]="progress"></div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cancel()"><fa-icon icon="ban"></fa-icon>&nbsp;<span>Cancel</span></button>

  <button type="button" id="save-entity" class="btn btn-primary" (click)="onUpload()">
    <fa-icon icon="save"></fa-icon>&nbsp;<span>Upload</span>
  </button>
</div>
