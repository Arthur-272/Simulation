[aws]
aws_region_name = us-west-2

[global]
cluster_template = default
update_check = false
sanity_check = true

[vpc public]
vpc_id = vpc-a38ba7db
master_subnet_id = subnet-5289020f

[cluster default]
key_name = server
base_os = alinux2
scheduler = slurm
master_instance_type = t2.micro	
s3_read_write_resource = *
vpc_settings = public
ebs_settings = myebs
queue_settings = compute

[queue compute]
compute_resource_settings = default
disable_hyperthreading = true
placement_group = DYNAMIC

[compute_resource default]
instance_type = c5.large
min_count = 0
max_count = 4

[ebs myebs]
shared_dir = /shared
volume_type = gp2
volume_size = 20

[scaling custom]
scaledown_idletime = 10

[aliases]
ssh = ssh {CFN_USER}@{MASTER_IP} {ARGS}
